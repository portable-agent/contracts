name: Release contracts

on:
  push:
    tags: ["v*.*.*"]

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Установить зависимости
        run: pnpm install --frozen-lockfile
      - name: Проверить тег и контракты
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          pnpm lint
          pnpm test
          pnpm build
      - name: Собрать bundle
        run: pnpm pack:contracts
      - name: Создать checksum
        shell: bash
        run: cd dist && sha256sum *.tgz > SHA256SUMS
      - name: Подписать происхождение bundle
        uses: actions/attest-build-provenance@46a583fd92dfbf46b772907a9740f888f4324bb9 # v3.1.0
        with:
          subject-path: dist/*.tgz
      - name: Создать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tgz dist/SHA256SUMS --verify-tag --generate-notes
